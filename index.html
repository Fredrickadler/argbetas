<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Syncopate:wght@700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            /* ست شدن تصویر پس‌زمینه ارسالی شما */
            background-image: url('https://i.imgur.com/dbJo37V_d.webp?maxwidth=1520&fidelity=grand');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* استایل ناوبری (هدر) */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 24px auto 0 auto;
            padding: 0 16px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            padding: 12px 28px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 3px;
            color: #ffffff;
            text-decoration: none;
        }

        /* لیست منوها */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 24px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-selector {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
        }

        .login-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .cta-btn-nav {
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .cta-btn-nav:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        /* بخش هیرو اصلی */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        /* ایجاد فونت کاملاً عریض با فاصله بسیار زیاد حروف مطابق طرح شما */
        .brand-title {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(36px, 10vw, 120px);
            font-weight: 700;
            letter-spacing: clamp(16px, 4.5vw, 65px); /* اعمال دقیق پرش و فاصله زیاد حروف */
            text-indent: clamp(16px, 4.5vw, 65px); /* بالانس کردن تورفتگی حرف آخر */
            text-transform: uppercase;
            margin-bottom: 60px;
            line-height: 1.1;
            color: #ffffff;
        }

        .subtitle {
            font-size: clamp(16px, 2.2vw, 22px);
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 35px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .cta-btn-main {
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 16px 48px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, background-color 0.2s ease;
            margin-bottom: 20px;
            display: inline-block;
        }

        .cta-btn-main:hover {
            transform: scale(1.02);
            background-color: rgba(255, 255, 255, 0.95);
        }

        .guarantee {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
        }

        /* واکنش‌گرایی موبایل: منوها به هیچ وجه غیب نمی‌شوند بلکه به درستی نمایش داده می‌شوند */
        @media (max-width: 991px) {
            .navbar {
                flex-direction: column;
                gap: 20px;
                border-radius: 24px;
                padding: 20px;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 16px;
            }
            header {
                margin-top: 12px;
            }
        }

        @media (max-width: 550px) {
            .nav-actions {
                width: 100%;
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
            }
            .cta-btn-nav {
                width: 100%;
                text-align: center;
            }
            .brand-title {
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">ARGUSVPN</a>
            
            <ul class="nav-links">
                <li><a href="#">Why ArgusVpn?</a></li>
                <li><a href="#">Cost</a></li>
                <li><a href="#">Support</a></li>
                <li><a href="#">Become a partner</a></li>
                <li><a href="#">Blog</a></li>
            </ul>
            
            <div class="nav-actions">
                <button class="lang-selector">EN</button>
                <a href="#" class="login-btn">Login</a>
                <a href="#" class="cta-btn-nav">Install ArgusVPN</a>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="brand-title">Argus</h1>
        <p class="subtitle">VPN THAT SIMPLY WORKS</p>
        <a href="#" class="cta-btn-main">Install ArgusVPN</a>
        <p class="guarantee">30-days money back guarantee</p>
    </main>

</body>
</html>

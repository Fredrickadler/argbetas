<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGUSVPN - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- کتابخانه‌های مورد نیاز: سوپابیس و اسکریپت وان‌تپ گوگل -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #05060f; /* رنگ تیره و عمیق امضای آرگوس */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* --- هدر کپسولی خطی همیشگی آرگوس --- */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 24px auto 0 auto;
            padding: 0 16px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            padding: 10px 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            height: 54px;
        }

        .logo {
            font-family: 'Audiowide', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links .active {
            color: #ffffff;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .lang-selector {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .cta-btn-nav {
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
        }

        /* --- باکس لاگین شیشه‌ای وسط صفحه --- */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
        }

        .login-card {
            background: rgba(10, 11, 26, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            width: 100%;
            max-width: 420px;
            padding: 48px 32px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* افکت گلو فوق‌العاده زیبای بنفش آرگوس در بالای کارت */
        .login-card::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%);
            filter: blur(15px);
            pointer-events: none;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 38px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* استایل دکمه‌های شیشه‌ای ورود سریع */
        .login-btn-oauth {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 14px;
            border-radius: 100px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background 0.2s, border-color 0.2s;
        }

        .login-btn-oauth:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* مات کردن دکمه آیفون برای نشان دادن غیرفعال بودن دکمه */
        .login-btn-oauth.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .oauth-icon {
            width: 18px;
            height: 18px;
        }

        .notice-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 32px;
            line-height: 1.5;
        }

        @media (max-width: 900px) {
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">ARGUSVPN</a>
            <ul class="nav-links">
                <li><a href="index.html">Why ArgusVpn?</a></li>
                <li><a href="cost.html">Cost</a></li>
                <li><a href="#">Support</a></li>
                <li><a href="#">Become a partner</a></li>
                <li><a href="#">Blog</a></li>
            </ul>
            <div class="nav-actions">
                <button class="lang-selector">EN</button>
                <a href="cost.html" class="cta-btn-nav">Install ArgusVPN</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="login-card">
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to manage your secure connection</p>

            <div class="btn-group">
                <!-- دکمه فعال گوگل -->
                <button class="login-btn-oauth" onclick="loginWithGoogle()">
                    <img class="oauth-icon" src="https://img.icons8.com/color/48/000000/google-logo.png" alt="Google">
                    <span>Continue with Google</span>
                </button>

                <!-- دکمه نمایشی آیفون (طبق خواسته شما کار نمیکنه) -->
                <button class="login-btn-oauth disabled" onclick="alert('Apple Sign-In is temporarily unavailable.')">
                    <img class="oauth-icon" src="https://img.icons8.com/ios-filled/50/ffffff/mac-os.png" alt="Apple">
                    <span>Continue with Apple</span>
                </button>
            </div>

            <p class="notice-text">By continuing, you agree to ArgusVPN's Terms of Service and Privacy Policy.</p>
        </div>
    </main>

    <script>
        // ۱. اطلاعات سوپابیس خودت را اینجا بذار
        const supabaseUrl = 'https://your-project-id.supabase.co'; 
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // روش اول: ورود با کلیک روی دکمه گوگل (Google OAuth)
        async function loginWithGoogle() {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/cost.html' // بعد از لاگین بره به صفحه قیمت‌ها
                }
            });
            if (error) console.error('Login Error:', error.message);
        }

        // روش دوم: وان‌تپ گوگل (One Tap) پاپ‌آپ خودکار بدون کلیک
        function handleCredentialResponse(response) {
            supabase.auth.signInWithIdToken({
                provider: 'google',
                token: response.credential
            }).then(({ data, error }) => {
                if (!error) window.location.href = '/cost.html';
            });
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com", // کلاینت آی‌دی گوگل رو اینجا بذار
                callback: handleCredentialResponse
            });
            google.accounts.id.prompt(); // نمایش خودکار پاپ‌آپ وان‌تپ گوگل در گوشه صفحه
        }
    </script>

</body>
</html>
